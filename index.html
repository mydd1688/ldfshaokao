<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老地方烧烤·点单</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;margin:0;background:#fff8ed;color:#222;font-size:18px}.top{background:#b42318;color:white;padding:18px 16px;position:sticky;top:0;z-index:2}.top h1{margin:0;font-size:28px}.top p{margin:8px 0 0}.wrap{padding:14px 14px 100px}.notice{background:#fff;border:2px solid #f0c36a;border-radius:12px;padding:12px;margin-bottom:12px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.cats button{white-space:nowrap;border:0;background:#ffe0a6;padding:10px 14px;border-radius:20px;font-size:17px}.cat h2{font-size:23px;border-left:6px solid #b42318;padding-left:9px}.item{background:#fff;border-radius:12px;padding:13px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 5px #ead9c4}.price{color:#b42318;font-weight:bold}.qty{display:flex;align-items:center;gap:9px}.qty button{width:38px;height:38px;border:0;border-radius:50%;font-size:25px;background:#b42318;color:#fff}.qty span{min-width:22px;text-align:center}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px;box-shadow:0 -2px 8px #ccc;display:flex;justify-content:space-between;align-items:center}.submit{background:#b42318;color:#fff;border:0;border-radius:10px;padding:13px 22px;font-size:19px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:3}.panel{background:#fff;margin:8vh 16px;padding:18px;border-radius:14px}.panel input,.panel select,.panel textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 12px;font-size:18px;border:1px solid #bbb;border-radius:8px}.success{display:none;position:fixed;inset:0;background:#fff8ed;z-index:5;padding:24px;overflow:auto}.success h2{color:#16803c;font-size:28px}.success .box{background:#fff;border-radius:12px;padding:16px;margin-top:15px}</style></head><body><div id="success" class="success"><h2>✓ 已下单成功</h2><div class="box" id="successContent"></div><button class="submit" onclick="location.reload()">继续点单</button></div><div class="top"><h1>老地方烧烤</h1><p>桌号：<b id="table">未识别</b>　电话：15960833687</p></div><div class="wrap"><div class="notice">请选商品和数量（分类可左滑更多）。点好后点击底部“提交订单”。<span id="editRecent"></span></div><div class="cats" id="cats"></div><div id="menu"></div></div><div class="bottom"><b>合计：¥<span id="total">0</span></b><button class="submit" onclick="openOrder()">提交订单</button></div><div class="modal" id="tableModal" style="display:block"><div class="panel"><h2>请选择用餐位置</h2><p>请先选择桌号；如果带走，请选择“外带”。</p><select id="tableChoice"><option value="">请选择用餐方式</option><option value="外带">外带</option><option>1号桌</option><option>2号桌</option><option>3号桌</option><option>4号桌</option><option>5号桌</option><option>6号桌</option><option>7号桌</option><option>8号桌</option><option>9号桌</option><option>10号桌</option><option>11号桌</option><option>12号桌</option><option>13号桌</option><option>14号桌</option><option>15号桌</option><option>16号桌</option><option>17号桌</option><option>18号桌</option><option>19号桌</option><option>20号桌</option></select><button class="submit" onclick="chooseTable()">开始点单</button></div></div><div class="modal" id="modal"><div class="panel"><h2>确认订单</h2><label>用餐方式</label><select id="way" onchange="document.getElementById('addrLabel').style.display=this.value==='外送'?'block':'none';document.getElementById('addr').style.display=this.value==='外送'?'block':'none'"><option>堂食</option><option>外送</option></select><label>称呼</label><input id="name" placeholder="例如：王叔叔"><label>联系电话（选填）</label><input id="phone" inputmode="tel" placeholder="请输入手机号"><label id="addrLabel" style="display:none">收货地址（选填）</label><input id="addr" style="display:none" placeholder="外送收货地址"><label>备注</label><textarea id="remark" rows="2" placeholder="少辣、不要香菜等"></textarea><button class="submit" onclick="submitOrder()">确认提交</button> <button onclick="closeOrder()">返回修改</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud.js"></script><script src="menu-default.js"></script><script>let data=JSON.parse(localStorage.shopMenu||'null')||window.DEFAULT_MENU;let cart={};let cats=document.getElementById('cats'),menu=document.getElementById('menu');Object.keys(data).forEach((c,i)=>{cats.innerHTML+=`<button onclick="show('${c}')">${c}</button>`});function show(c){menu.innerHTML=`<div class="cat"><h2>${c}</h2>${data[c].map((x,i)=>`<div class="item"><div>${x[0]}<br><span class="price">${typeof x[1]==='number'?'¥'+x[1]:x[1]}</span></div><div class="qty"><button onclick="add('${c}',${i},-1)">−</button><span id="q-${c}-${i}">${cart[c+'-'+i]||0}</span><button onclick="add('${c}',${i},1)">＋</button></div></div>`).join('')}</div>`}function add(c,i,n){let k=c+'-'+i;cart[k]=Math.max(0,(cart[k]||0)+n);document.getElementById('q-'+k).textContent=cart[k];let t=0;Object.keys(cart).forEach(k=>{let [c,i]=k.split('-');let p=data[c][i][1];if(typeof p==='number')t+=p*cart[k]});document.getElementById('total').textContent=t}function openOrder(){if(!Object.values(cart).some(x=>x>0)){alert('请先选择商品');return}document.getElementById('modal').style.display='block'}function closeOrder(){document.getElementById('modal').style.display='none'}function submitOrder(){let o={table:document.getElementById('table').textContent,name:document.getElementById('name').value,phone:document.getElementById('phone').value,way:document.getElementById('way').value,address:document.getElementById('addr').value,remark:document.getElementById('remark').value,cart,items:Object.keys(cart).filter(k=>cart[k]>0).map(k=>{let z=k.split('-');return {name:data[z[0]][z[1]][0],category:z[0],price:data[z[0]][z[1]][1],qty:cart[k]}}),total:document.getElementById('total').textContent,time:new Date().toLocaleString(),createdAt:Date.now()};let orders=JSON.parse(localStorage.orders||'[]');let now=new Date(),prefix=''+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0'),same=orders.filter(x=>String(x.id).startsWith(prefix)).length+1;o.id=prefix+(same>1?String(same-1).padStart(2,'0'):'');orders.unshift(o);localStorage.orders=JSON.stringify(orders);localStorage.lastOrderId=o.id;document.getElementById('modal').style.display='none';document.getElementById('tableModal').style.display='none';document.getElementById('successContent').innerHTML='<b>订单编号：</b>'+o.id+'<br><b>用餐方式：</b>'+o.way+(o.address?'<br><b>收货地址：</b>'+o.address:'')+'<hr>'+(o.items||[]).map(x=>'<div>'+x.name+'　'+x.qty+'份　¥'+(Number(x.price||0)*x.qty)+'</div>').join('')+'<hr><b>合计：¥'+o.total+'</b>';document.getElementById('success').style.display='block'}function editRecent(){let id=localStorage.lastOrderId,a=JSON.parse(localStorage.orders||'[]'),o=a.find(x=>x.id===id);if(!o){alert('暂无可修改的订单');return}let box=document.createElement('div');box.className='modal';box.style.display='block';box.innerHTML='<div class="panel"><h2>修改最近订单</h2><p>请一次性调整下面各项数量，填0可删除。</p>'+((o.items||[]).map((x,i)=>'<label>'+x.name+'（单价¥'+(x.price||0)+'）</label><input type="number" min="0" id="editq'+i+'" value="'+x.qty+'">').join(''))+'<button class="submit" id="saveEdit">保存修改</button> <button id="cancelEdit">取消</button></div>';document.body.appendChild(box);document.getElementById('cancelEdit').onclick=()=>box.remove();document.getElementById('saveEdit').onclick=()=>{(o.items||[]).forEach((x,i)=>x.qty=Math.max(0,Number(document.getElementById('editq'+i).value)||0));o.items=o.items.filter(x=>x.qty>0);o.total=o.items.reduce((t,x)=>t+(Number(x.price)||0)*x.qty,0);localStorage.orders=JSON.stringify(a);box.remove();alert('订单已修改');location.reload()}}let recent=localStorage.lastOrderId;if(recent)document.getElementById('editRecent').innerHTML='<br><button onclick="editRecent()">修改最近订单（'+recent+'）</button>';function chooseTable(){let v=document.getElementById('tableChoice').value;if(!v){alert('请先选择桌号或外带');return}document.getElementById('table').textContent=v;document.getElementById('way').value=(v==='外带'?'外送':'堂食');document.getElementById('way').dispatchEvent(new Event('change'));document.getElementById('tableModal').style.display='none'}let params=new URLSearchParams(location.search);let qrTable=params.get('table');if(qrTable){document.getElementById('table').textContent=qrTable;document.getElementById('way').value=(qrTable==='外带'?'外送':'堂食');document.getElementById('way').dispatchEvent(new Event('change'));document.getElementById('tableModal').style.display='none'}show(Object.keys(data)[0]);</script><script src="customer-cloud.js"></script></body></html>
