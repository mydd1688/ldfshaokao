<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜品管理</title><style>body{font:18px 'Microsoft YaHei',sans-serif;background:#fff8ed;margin:20px}button,input,select{font-size:18px;padding:10px;margin:5px;max-width:90%;box-sizing:border-box}button{cursor:pointer}section{padding:12px;background:white;border-radius:12px;margin:12px 0}.row{border-bottom:1px solid #ddd;padding:10px 0}label{display:inline-block}a{color:#b42318}</style><a href="admin.html">返回订单后台</a><h1>菜品管理</h1><p>云端菜单：保存后新打开或刷新的顾客页面生效；历史订单保留原单价。</p><section><h2>新增菜品</h2><label>分类<input id="category" placeholder="例如：青菜类"></label><label>名称<input id="name" placeholder="例如：牛油小串（10串）"></label><label>单价（元）<input id="price" type="number" min="0.01" step="0.01"></label><button id="add">新增菜品</button></section><div id="list"></div><p id="message" role="status"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud.js"></script><script src="menu-cloud.js"></script></html>
