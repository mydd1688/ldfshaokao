<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商家订单后台</title><style>body{font-family:Arial,'Microsoft YaHei';background:#f6f6f6;margin:0;padding:20px}h1{color:#b42318}.card{background:#fff;padding:15px;margin:12px 0;border-radius:10px}.pending{background:#ffe0e0}.cooking{background:#dcecff}.served{background:#dcf7df}.row{border-bottom:1px solid #ddd;padding:10px 0}button{padding:10px 14px;border:0;border-radius:7px;background:#b42318;color:#fff}input{padding:10px;width:90%;margin:5px 0}</style><h1>老地方烧烤｜订单后台</h1><p>订单会保存在本设备浏览器中。企业微信群机器人 Webhook 可在此配置。</p><input id="webhook" placeholder="企业微信群机器人 Webhook（可选）"><button onclick="save()">保存配置</button><div id="list"></div><script>function save(){localStorage.webhook=document.getElementById('webhook').value;alert('已保存')}document.getElementById('webhook').value=localStorage.webhook||'';function orders(){return JSON.parse(localStorage.orders||'[]')}function saveOrders(a){localStorage.orders=JSON.stringify(a)}function setStatus(id,status){let a=orders(),x=a.find(o=>o.id===id);if(x){x.status=status;saveOrders(a);render()}}function modifyOrder(id){let a=orders(),o=a.find(x=>x.id===id);if(!o)return;(o.items||[]).forEach(x=>{let q=prompt('请输入 '+x.name+' 的数量（填0删除）',x.qty);if(q!==null&&Number(q)>=0)x.qty=Number(q)});o.items=(o.items||[]).filter(x=>x.qty>0);saveOrders(a);render()}function voidOrder(id){if(!confirm('确定要作废这个订单吗？作废后会移入回收站，可恢复。'))return;let a=orders(),o=a.find(x=>x.id===id);if(o){o.status='canceled';o.canceledAt=new Date().toLocaleString();saveOrders(a);render()}}function restoreOrder(id){let a=orders(),o=a.find(x=>x.id===id);if(o){o.status='pending';delete o.canceledAt;saveOrders(a);render()}}function deleteOrder(id){saveOrders(orders().filter(x=>x.id!==id));render()}function card(o,bin){let actions=bin?'<button onclick="restoreOrder(\''+o.id+'\')">恢复订单</button> <button onclick="deleteOrder(\''+o.id+'\')">删除</button>':'<button onclick="modifyOrder(\''+o.id+'\')">修改</button> <button onclick="voidOrder(\''+o.id+'\')">作废</button>';return '<div class="card '+(o.status||'pending')+'"><div style="display:flex;justify-content:space-between"><b>'+o.id+'｜'+o.table+'｜'+o.time+'</b><span>'+actions+'</span></div><div>顾客：'+(o.name||'未填写')+'　电话：'+(o.phone||'未填写')+'</div><div>方式：'+o.way+(o.address?'｜地址：'+o.address:'')+'</div><div><b>商品明细：</b>'+((o.items||[]).map(x=>{let unit=Number(x.price)||0;return '<div>'+x.name+'｜单价：¥'+unit+'｜'+x.qty+'份｜小计：¥'+(unit*x.qty)+'</div>'}).join('')||'<div>无商品明细</div>')+'</div><div>金额：¥'+o.total+'　备注：'+(o.remark||'无')+'</div>'+(bin?'<div>作废时间：'+o.canceledAt+'</div>':'<button onclick="setStatus(\''+o.id+'\',\'cooking\')">正在烤</button> <button onclick="setStatus(\''+o.id+'\',\'served\')">已送餐</button> <button onclick="setStatus(\''+o.id+'\',\'pending\')">未处理</button>')+'</div>'}let view='active',statusFilter='pending';function switchView(v){view=v;render()}function filterStatus(v){statusFilter=v;view='active';render()}function stats(){let month=document.getElementById('statMonth')?.value||new Date().toISOString().slice(0,7),all=orders().filter(o=>o.status!=='canceled'&&((o.createdAt?new Date(o.createdAt):new Date(o.time)).toISOString().slice(0,7)===month)),cats={},items={},total=0,count=0;all.forEach(o=>(o.items||[]).forEach(x=>{let q=Number(x.qty)||0,p=Number(x.price)||0;count+=q;total+=q*p;let c=x.category||'未分类';cats[c]=(cats[c]||{qty:0,total:0});cats[c].qty+=q;cats[c].total+=q*p;items[x.name]=(items[x.name]||{qty:0,total:0});items[x.name].qty+=q;items[x.name].total+=q*p}));return '<h2>销售统计</h2><label>选择月份：<input id="statMonth" type="month" value="'+month+'" onchange="render()"></label><div class="card"><b>订单数：</b>'+all.length+'　<b>菜品数量：</b>'+count+'　<b>销售金额：</b>¥'+total+'</div><div class="card"><h3>按分类</h3>'+Object.keys(cats).map(k=>'<div>'+k+'：'+cats[k].qty+'份，¥'+cats[k].total+'</div>').join('')+'</div><div class="card"><h3>按菜品</h3>'+Object.keys(items).sort((a,b)=>items[b].qty-items[a].qty).map(k=>'<div>'+k+'：'+items[k].qty+'份，¥'+items[k].total+'</div>').join('')+'</div>'}function render(){let a=orders(),nav='<div style="display:flex;gap:10px;margin:15px 0"><button onclick="switchView(\'active\')">当前订单</button><button onclick="switchView(\'bin\')">回收站</button><button onclick="switchView(\'stats\')">本月统计</button></div>';if(view==='stats'){document.getElementById('list').innerHTML=nav+stats();return}let items=a.filter(o=>view==='bin'?o.status==='canceled':o.status!=='canceled'&&(o.status||'pending')===statusFilter);let sub=view==='active'?'<div style="margin:8px 0 15px;display:flex;gap:24px"><span onclick="filterStatus(\'pending\')" style="color:#000;cursor:pointer;font-weight:bold">未处理</span><span onclick="filterStatus(\'cooking\')" style="color:#000;cursor:pointer;font-weight:bold">正在烤</span><span onclick="filterStatus(\'served\')" style="color:#000;cursor:pointer;font-weight:bold">已送餐</span></div>':'';document.getElementById('list').innerHTML=nav+(view==='bin'?'<h2>回收站</h2>':'<h2>当前订单</h2>')+sub+(items.length?items.map(o=>card(o,view==='bin')).join(''):(view==='bin'?'<p>回收站为空</p>':'<p>暂无该分类订单</p>'))}render();</script></html>
